# Render blueprint. A disk is required: the SQLite store must survive a redeploy.
services:
  - type: web
    name: magnet
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    disk:
      name: lnkz-data
      mountPath: /app/.data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3100"
      - key: MAGNET_API_KEY
        generateValue: true
      - key: MAGNET_PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
